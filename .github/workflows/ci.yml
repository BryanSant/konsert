name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Go Lint, Vet, Tidy & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: go mod tidy check
        run: go mod tidy -diff

      - name: go vet (all target OSes)
        run: |
          go vet ./...
          GOOS=windows go vet ./internal/worker/... ./internal/gitutil/... ./cmd/konsertd/...
          GOOS=darwin go vet ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  windows:
    name: Windows Worker Tests (ConPTY)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run worker test suite
        run: go test -count=1 ./internal/worker/... ./internal/gitutil/... ./internal/protocol/... ./cmd/konsertd/...

  web:
    name: Angular Vitest & PWA Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run Angular Vitest unit tests
        working-directory: web
        env:
          CI: "true"
          NG_CLI_ANALYTICS: "false"
        run: npx ng test --watch=false

      - name: Build embedded Angular PWA
        env:
          NG_CLI_ANALYTICS: "false"
        run: make web

      - name: Upload webdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webdist
          path: internal/controller/webdist/
          retention-days: 1

  go:
    name: Go Race Tests & Cross-Builds
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download webdist artifact
        uses: actions/download-artifact@v4
        with:
          name: webdist
          path: internal/controller/webdist/

      - name: Run Go race test suite
        run: go test -race -count=1 ./...

      - name: Verify multi-OS / multi-arch builds
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/konsert ./cmd/konsertd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/konsert ./cmd/konsertd
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/konsert ./cmd/konsertd
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/konsertd

  e2e:
    # Includes the subscription-only chat flow (web/e2e/subscription-chat.spec.ts): the mock
    # agent engine, no API key anywhere (global-setup strips provider keys from the env).
    name: Playwright E2E (Desktop & Mobile PWA)
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Download webdist artifact
        uses: actions/download-artifact@v4
        with:
          name: webdist
          path: internal/controller/webdist/

      - name: Build konsert & konsertd
        run: make build

      - name: Install Playwright & Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  container:
    name: Multi-Arch konsertd Containerfile Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build konsertd container (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
