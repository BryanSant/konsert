version: 2

project_name: syre

before:
  hooks:
    - make web

builds:
  - id: syre
    main: ./cmd/syre
    binary: syre
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

  - id: syred
    main: ./cmd/syred
    binary: syred
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: syre-archive
    ids:
      - syre
    formats:
      - tar.gz
    name_template: "syre_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: syred-archive
    ids:
      - syred
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "syred_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
